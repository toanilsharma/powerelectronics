[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "https://powerelectronicslab.netlify.app/*"
  to = "https://powerelectronics.livesimulators.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "all"
